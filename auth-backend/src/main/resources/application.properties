spring.jpa.hibernate.ddl-auto=update

# Session cookie hardening
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set to true when running over HTTPS (production)
server.servlet.session.cookie.secure=false

# React dev server origin
app.cors.allowed-origin=http://localhost:5173
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.password-reset-token-minutes=15
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@activepass.local}}

# Supply these values through the environment; do not store credentials here.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Configure SMTP through environment variables to enable password reset emails.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
